<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Stack concept</title>
<style>
  :root {
    --bg: #0e0e0e;
    --card: #151515;
    --ink: #f2f0ee;
    --label: #9a9796;
    --muted: #6f6c6b;
    --border: rgba(255, 255, 255, .09);
    --font-mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1554px; height: 448px; overflow: hidden; }
  body {
    position: relative;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    user-select: none; -webkit-user-select: none;
  }

  svg { position: absolute; inset: 0; pointer-events: none; z-index: 5; }

  .card {
    position: absolute; width: 236px; height: 132px; padding: 19px 20px 15px;
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--border); border-radius: 0;
  }
  .card h3 { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; }
  .card .sub { margin-top: 3px; font-family: var(--font-mono); font-size: 14px; color: var(--muted); white-space: nowrap; }
  .card .foot { margin-top: auto; padding-top: 10px; display: flex; align-items: center; }
  .pill {
    padding: 2px 8px; background: #222120; color: var(--label);
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  }

  .card.start { border-color: #e9e7e5; box-shadow: 0 0 0 5px rgba(255, 255, 255, .06); }
  .card.start .pill { background: var(--ink); color: var(--bg); }
  .card.solid { background: transparent; }
  .card.mcp { background: #070707; border-color: rgba(255, 255, 255, .07); box-shadow: inset 0 1px 0 rgba(0, 0, 0, .6); }
  .card.mcp .pill { background: #1a1a1a; color: #9d9a99; }

  .label {
    position: absolute; transform: translate(-50%, -50%); z-index: 6;
    padding: 3px 6px; background: var(--bg);
    font-family: var(--font-mono); font-size: 12px; line-height: 1; color: var(--muted); white-space: nowrap;
  }

  .group { position: absolute; height: 12px; display: flex; align-items: center; gap: 10px; }
  .group::before, .group::after { content: ""; width: 1px; height: 9px; background: var(--muted); opacity: .6; }
  .group b {
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: #8a8786; white-space: nowrap;
  }
  .group i { flex: 1; height: 1px; background: rgba(255, 255, 255, .14); }
</style>
</head>
<body>

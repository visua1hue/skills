<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Stack concept</title>
<style>
  :root {
    --bg: #f7f5f3;
    --card: #ffffff;
    --ink: #0d0d0d;
    --label: #6f6b6a;
    --muted: #9a9695;
    --border: rgba(0, 0, 0, .08);
    --font-mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
    --fs-title-lg: 28px;
    --fs-title: 24px;
    --fs-text: 13px;
    --fs-tag: 11px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1554px; height: 394px; overflow: hidden; }
  body {
    position: relative;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    user-select: none; -webkit-user-select: none;
  }

  svg { position: absolute; inset: 0; pointer-events: none; z-index: 5; }

  .card {
    position: absolute; width: 196px; height: 108px; padding: 14px 16px 12px;
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--border); border-radius: 0;
  }
  .card h3 { font-size: var(--fs-title); font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; }
  .card .sub { margin-top: 4px; font-family: var(--font-mono); font-size: var(--fs-text); color: var(--muted); white-space: nowrap; }
  .card .foot { margin-top: auto; padding-top: 10px; display: flex; align-items: center; }
  .pill {
    padding: 2px 8px; background: #f0eeeb; color: var(--label);
    font-size: var(--fs-tag); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  }

  .card.start {
    width: 230px; height: 128px; padding: 18px 20px 16px;
    background: var(--ink); border-color: var(--ink); color: var(--bg);
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
  }
  .card.start h3 { font-size: var(--fs-title-lg); }
  .card.start .sub { color: #d0cdcd; }
  .card.start .pill { background: var(--bg); color: var(--ink); }
  .card.solid { background: transparent; border-color: rgba(0, 0, 0, .24); }
  .card.mcp { background: #efedea; border-color: rgba(0, 0, 0, .06); box-shadow: inset 0 1px 0 rgba(0, 0, 0, .04); }
  .card.mcp .pill { background: #e4e1de; color: var(--label); }

  .label {
    position: absolute; transform: translate(-50%, -50%); z-index: 6;
    padding: 3px 6px; background: var(--bg);
    font-family: var(--font-mono); font-size: var(--fs-text); line-height: 1; color: var(--muted); white-space: nowrap;
  }

  .group { position: absolute; height: 12px; display: flex; align-items: center; gap: 10px; }
  .group::before, .group::after { content: ""; width: 1px; height: 9px; background: var(--muted); opacity: .6; }
  .group b {
    font-size: var(--fs-tag); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: #8a8685; white-space: nowrap;
  }
  .group i { flex: 1; height: 1px; background: rgba(0, 0, 0, .1); }
</style>
</head>
<body>

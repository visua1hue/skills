<!doctype html>

<head>
<meta charset="utf-8">
<title>Agent Stack concept</title>
<style>
  :root {
    --bg: #f7f5f3;
    --card: #fbfbfa;
    --ink: #0d0d0d;
    --label: #757575;
    --muted: #a8a5a5;
    --border: rgba(13, 13, 13, .09);
    --font-mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1554px; height: 408px; overflow: hidden; }
  body {
    position: relative;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    user-select: none; -webkit-user-select: none;
  }

  svg { position: absolute; inset: 0; pointer-events: none; z-index: 5; }

  .card {
    position: absolute; width: 236px; height: 132px; padding: 19px 20px 15px;
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--border); border-radius: 0;
    box-shadow: 0 1px 2px rgba(13, 13, 13, .05);
  }
  .card h3 { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.05; }
  .card .sub { margin-top: 3px; font-family: var(--font-mono); font-size: 14px; color: var(--muted); white-space: nowrap; }
  .card .foot { margin-top: auto; padding-top: 10px; display: flex; align-items: center; }
  .pill {
    padding: 2px 8px; background: #efeeec; color: var(--label);
    font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
  }

  .card.start { border-color: var(--ink); box-shadow: 0 0 0 5px rgba(13, 13, 13, .06); }
  .card.start .pill { background: var(--ink); color: var(--bg); }
  .card.solid { box-shadow: none; background: transparent; }
  .card.mcp { background: #e8e6e4; box-shadow: none; }
  .card.mcp .sub { color: #5f5c5c; }
  .card.mcp .pill { background: rgba(13, 13, 13, .07); color: #4d4b4b; }

  .label {
    position: absolute; transform: translate(-50%, -50%); z-index: 6;
    padding: 3px 6px; background: var(--bg);
    font-family: var(--font-mono); font-size: 12px; line-height: 1; color: #8d8a8a; white-space: nowrap;
  }
</style>
</head>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Agent Stack concept</title>
<style>
  :root { --bg:#f7f5f3; --card:#fff; --ink:#0d0d0d; --label:#6f6b6a; --muted:#9a9695; --border:rgba(0,0,0,.08);
    --chip:#f0eeeb; --mcp:#555555; --mono: ui-monospace,"SFMono-Regular",Menlo,Monaco,Consolas,monospace; }
  * { box-sizing:border-box; margin:0; }
  html, body { width:1554px; height:249px; overflow:hidden; }
  body { position:relative; font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif; color:var(--ink);
    background:var(--bg); -webkit-font-smoothing:antialiased; }
  svg { position:absolute; inset:0; pointer-events:none; z-index:5; }
  .card { position:absolute; width:218px; height:114px; padding:14px 16px 12px; display:flex; flex-direction:column;
    background:var(--card); border:1px solid var(--border); }
  .card h3 { font-size:26px; font-weight:600; letter-spacing:-0.02em; line-height:1.05; }
  .card .sub { margin-top:4px; font-family:var(--mono); font-size:15px; line-height:1.45; color:var(--muted); white-space:nowrap; }
  .card .foot { margin-top:auto; padding-top:10px; display:flex; gap:6px; align-items:center; }
  .pill { padding:2px 8px; background:var(--chip); color:var(--label); font-size:11px; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase; }
  .pill.mcp { background:var(--mcp); color:#fff; }
  .card.ref .pill { background:transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,.18); }
  .card.start { width:250px; height:134px; padding:18px 20px 16px; background:var(--ink); border-color:var(--ink);
    color:var(--bg); clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%); }
  .card.start h3 { font-size:30px; }
  .card.start .sub { color:#d0cdcd; }
  .card.start .pill { background:var(--bg); color:var(--ink); }
  .label { position:absolute; transform:translate(-50%,-50%); z-index:6; padding:4px 8px; background:var(--bg);
    font-size:13px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; line-height:1; white-space:nowrap; }
  .group { position:absolute; height:12px; display:flex; align-items:center; gap:10px; }
  .group::before, .group::after { content:""; width:1px; height:9px; background:var(--muted); opacity:.6; }
  .group b { font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:#8a8685; white-space:nowrap; }
  .group i { flex:1; height:1px; background:rgba(0,0,0,.1); }
</style></head><body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Skills preview</title>
<style>
  :root {
    --bg: #f7f5f3;
    --ink: #0d0d0d;
    --muted: #d0cdcd;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1760px; height: 560px; overflow: hidden; }
  body {
    position: relative;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--muted);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    user-select: none; -webkit-user-select: none;
  }

  .t {
    position: absolute; left: 120px; top: 0; height: 560px;
    display: flex; align-items: center;
    font-size: 92px; line-height: 1.04; letter-spacing: -0.035em;
  }
  .t b { color: var(--ink); font-weight: 650; }
</style>
</head>
<body>
<p class="t"><span><b>Agent Skills</b>, built by you,<br>run by agents.</span></p>
</body>
</html>

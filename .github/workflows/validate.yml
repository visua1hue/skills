name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: manifest integrity + skill dirs
        run: |
          python3 - <<'EOF'
          import yaml, sys, os

          errors = []

          with open("MANIFEST.yaml") as f:
              manifest = yaml.safe_load(f)

          for skill in manifest.get("upstreams", {}):
              if not os.path.isdir(skill):
                  errors.append(f"MANIFEST entry '{skill}' has no directory ./{skill}/")
              elif not os.path.isfile(f"{skill}/SKILL.md"):
                  errors.append(f"missing {skill}/SKILL.md")

          for entry in sorted(os.listdir(".")):
              if entry.startswith("."):
                  continue
              if os.path.isdir(entry) and not os.path.isfile(f"{entry}/SKILL.md"):
                  errors.append(f"directory '{entry}/' has no SKILL.md")

          if errors:
              [print(f"error: {e}") for e in errors]
              sys.exit(1)
          print("ok")
          EOF
